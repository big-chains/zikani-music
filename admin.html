<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZIKANI | Admin Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=Syncopate:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: {
                fontFamily: { sans: ['Outfit', 'sans-serif'], display: ['Syncopate', 'sans-serif'] },
                colors: { dark: '#121418', card: '#1e2128', accent: '#4cdbb0' }
            }}
        }
    </script>
    <style>
        body { background: #121418; }
        .glass { background: rgba(255,255,255,0.04); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
        .tab-active { border-bottom: 2px solid #4cdbb0; color: #4cdbb0; }
        .tab-inactive { border-bottom: 2px solid transparent; color: #6b7280; }
        .input-field {
            width: 100%; background: #0d0f12; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; padding: 12px 16px; color: white; outline: none; transition: border-color 0.2s;
        }
        .input-field:focus { border-color: #4cdbb0; }
        .input-field::placeholder { color: #4b5563; }

        /* Animated background */
        .bg-glow { position: fixed; width: 600px; height: 600px; border-radius: 50%;
            background: radial-gradient(circle, rgba(76,219,176,0.08) 0%, transparent 70%);
            top: -200px; left: -200px; pointer-events: none; }
        .bg-glow-2 { position: fixed; width: 400px; height: 400px; border-radius: 50%;
            background: radial-gradient(circle, rgba(76,219,176,0.05) 0%, transparent 70%);
            bottom: -100px; right: -100px; pointer-events: none; }
    </style>
</head>
<body class="text-white min-h-screen flex items-center justify-center p-6 font-sans">

    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>

    <div class="w-full max-w-md relative z-10">
        <!-- Logo -->
        <div class="text-center mb-10">
            <div class="text-3xl font-display font-bold tracking-wider mb-2">
                ZIK<span class="text-accent">ANI.</span>
            </div>
            <p class="text-gray-500 text-sm uppercase tracking-widest">Management Console</p>
        </div>

        <div class="glass rounded-2xl p-8 shadow-2xl">
            <!-- Tabs -->
            <div class="flex mb-8 border-b border-white/10">
                <button id="tab-login" onclick="switchTab('login')"
                    class="tab-active pb-3 mr-8 text-sm font-semibold focus:outline-none transition-colors">
                    Sign In
                </button>
                <button id="tab-register" onclick="switchTab('register')"
                    class="tab-inactive pb-3 text-sm font-semibold focus:outline-none transition-colors">
                    Create Account
                </button>
            </div>

            <!-- LOGIN FORM -->
            <div id="panel-login">
                <form id="login-form" onsubmit="login(event)" class="space-y-4">
                    <div>
                        <label class="text-xs text-gray-400 uppercase tracking-widest mb-2 block">Email Address</label>
                        <input type="email" id="admin-email" placeholder="admin@zikani.com" class="input-field" required>
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 uppercase tracking-widest mb-2 block">Password</label>
                        <input type="password" id="admin-pass" placeholder="••••••••" class="input-field" required>
                    </div>
                    <p id="login-error" class="text-red-400 text-sm hidden text-center py-2 bg-red-500/10 rounded-lg"></p>
                    <button type="submit" id="login-btn"
                        class="w-full bg-accent text-dark font-bold py-3 rounded-xl hover:bg-white transition-all mt-2 uppercase tracking-widest text-sm">
                        Secure Login
                    </button>
                </form>
            </div>

            <!-- REGISTER FORM -->
            <div id="panel-register" class="hidden">
                <form id="register-form" onsubmit="register(event)" class="space-y-4">
                    <div>
                        <label class="text-xs text-gray-400 uppercase tracking-widest mb-2 block">Full Name</label>
                        <input type="text" id="reg-name" placeholder="Your Name" class="input-field" required>
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 uppercase tracking-widest mb-2 block">Email Address</label>
                        <input type="email" id="reg-email" placeholder="admin@zikani.com" class="input-field" required>
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 uppercase tracking-widest mb-2 block">Password</label>
                        <input type="password" id="reg-pass" placeholder="Min. 6 characters" class="input-field" required minlength="6">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 uppercase tracking-widest mb-2 block">Confirm Password</label>
                        <input type="password" id="reg-pass-confirm" placeholder="Repeat password" class="input-field" required>
                    </div>
                    <p id="register-msg" class="text-sm hidden text-center py-2 rounded-lg"></p>
                    <button type="submit" id="register-btn"
                        class="w-full bg-accent text-dark font-bold py-3 rounded-xl hover:bg-white transition-all mt-2 uppercase tracking-widest text-sm">
                        Create Account
                    </button>
                </form>
            </div>
        </div>

        <p class="text-center text-gray-700 text-xs mt-6">© 2026 Zikani Music. All rights reserved.</p>
    </div>

<script>
    const API_URL = "/api";

    // If already logged in, go straight to dashboard
    if (localStorage.getItem('admin_token')) {
        window.location.href = '/admin/dashboard';
    }

    function switchTab(tab) {
        const isLogin = tab === 'login';
        document.getElementById('panel-login').classList.toggle('hidden', !isLogin);
        document.getElementById('panel-register').classList.toggle('hidden', isLogin);
        document.getElementById('tab-login').className = isLogin
            ? 'tab-active pb-3 mr-8 text-sm font-semibold focus:outline-none transition-colors'
            : 'tab-inactive pb-3 mr-8 text-sm font-semibold focus:outline-none transition-colors';
        document.getElementById('tab-register').className = !isLogin
            ? 'tab-active pb-3 text-sm font-semibold focus:outline-none transition-colors'
            : 'tab-inactive pb-3 text-sm font-semibold focus:outline-none transition-colors';
        document.getElementById('login-error').classList.add('hidden');
        document.getElementById('register-msg').classList.add('hidden');
    }

    async function login(e) {
        e.preventDefault();
        const email = document.getElementById('admin-email').value;
        const pass = document.getElementById('admin-pass').value;
        const btn = document.getElementById('login-btn');
        const errorEl = document.getElementById('login-error');

        btn.innerText = 'Authenticating...';
        btn.disabled = true;
        errorEl.classList.add('hidden');

        try {
            const res = await fetch(`${API_URL}/admin/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password: pass })
            });
            const data = await res.json();
            if (res.ok) {
                localStorage.setItem('admin_token', data.token);
                window.location.href = '/admin/dashboard';
            } else {
                errorEl.innerText = data.error || 'Invalid credentials.';
                errorEl.classList.remove('hidden');
            }
        } catch (err) {
            errorEl.innerText = 'Network error. Is the server running?';
            errorEl.classList.remove('hidden');
        } finally {
            btn.innerText = 'Secure Login';
            btn.disabled = false;
        }
    }

    async function register(e) {
        e.preventDefault();
        const name = document.getElementById('reg-name').value;
        const email = document.getElementById('reg-email').value;
        const pass = document.getElementById('reg-pass').value;
        const confirm = document.getElementById('reg-pass-confirm').value;
        const btn = document.getElementById('register-btn');
        const msgEl = document.getElementById('register-msg');

        if (pass !== confirm) {
            msgEl.innerText = 'Passwords do not match.';
            msgEl.className = 'text-red-400 text-sm text-center py-2 bg-red-500/10 rounded-lg';
            msgEl.classList.remove('hidden');
            return;
        }

        btn.innerText = 'Creating Account...';
        btn.disabled = true;
        msgEl.classList.add('hidden');

        try {
            const res = await fetch(`${API_URL}/admin/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password: pass })
            });
            const data = await res.json();
            if (res.ok) {
                msgEl.innerText = '✅ ' + data.message;
                msgEl.className = 'text-green-400 text-sm text-center py-2 bg-green-500/10 rounded-lg';
                msgEl.classList.remove('hidden');
                document.getElementById('register-form').reset();
                setTimeout(() => switchTab('login'), 2000);
            } else {
                msgEl.innerText = data.error || 'Registration failed.';
                msgEl.className = 'text-red-400 text-sm text-center py-2 bg-red-500/10 rounded-lg';
                msgEl.classList.remove('hidden');
            }
        } catch (err) {
            msgEl.innerText = 'Network error. Is the server running?';
            msgEl.className = 'text-red-400 text-sm text-center py-2 bg-red-500/10 rounded-lg';
            msgEl.classList.remove('hidden');
        } finally {
            btn.innerText = 'Create Account';
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
